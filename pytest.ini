# pytest 配置
#
# [FIX-NVENC-TEST-ISOLATE] 立项：Plan/NVENC硬件测试隔离_立项Prompt.md
#
# 背景：`pytest tests/` 全量跑会在 NVENC 编码器测试阶段 SIGSEGV（EXIT=139），
# 但把崩溃的类单独跑却通过 —— 属跨测试类的 CUDA/NVENC 会话状态污染。
# 处置分两步（见立项文档 §3）：
#   方案 A（已落地，纯 CPU 可做）：`tests/run_all_isolated.sh` 逐文件独立进程执行，
#                                 任一进程崩溃不影响其余，崩溃可归因到具体文件；
#   方案 B/C（需 Linux + GPU 验证后再定）：conftest 加 autouse 清理 fixture，
#                                 或给硬件测试打 `hw` 标记后按需选跑。
#
# ── 关于 `hw` 标记 ──────────────────────────────────────────────────────────
# 本文件**只注册标记**，不设置 `addopts = -m "not hw"`。
#
# 有意为之：把硬件测试默认跳过，会让"跑全量"从"崩掉"变成"静默少跑 14 个文件"，
# 与 memory/feedback_keep_strict_criteria_annotate.md 的约定冲突
# （保严格判据 + 标注，不为消警而放宽/隐藏）。要跳过必须**显式**：
#
#     pytest -m "not hw"      # 显式排除硬件测试
#     pytest -m hw            # 只跑硬件测试（仍需 Linux + GPU）
#
# 待 Linux + GPU 侧确认方案 B 无法根治后，再考虑把默认改为排除。

[pytest]
testpaths = tests

markers =
    hw: 需要 NVIDIA GPU / NVENC 硬件的测试（本机无 GPU 时用 `-m "not hw"` 显式排除）

# 保留 pytest 缓存会跨进程复用上一次的结果，与"逐文件隔离"的初衷冲突；
# 隔离入口已单独传 `-p no:cacheprovider`，这里再兜一层默认行为。
addopts = -p no:cacheprovider
